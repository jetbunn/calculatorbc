<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembuat Struk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Struk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#d9d6cf;--acc:#1f5f4a;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--card:#202226;--ink:#eceae4;--mut:#9a988f;--line:#34363b;--acc:#6fcf9f;--accink:#10231a}}
:root[data-theme="dark"]{--bg:#16171a;--card:#202226;--ink:#eceae4;--mut:#9a988f;--line:#34363b;--acc:#6fcf9f;--accink:#10231a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px}
.row>*{min-width:0;flex:1}
.item{display:grid;grid-template-columns:1fr 60px 100px 36px;gap:6px;margin-bottom:6px;align-items:center}
.item button{padding:8px 0}
.head{font-size:.8rem;color:var(--mut)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:8px;cursor:pointer}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.sum{display:flex;justify-content:space-between;margin-top:8px}
.total{font-size:1.25rem;font-weight:700}
.prev{overflow-x:auto;text-align:center}
canvas{max-width:100%;border:1px dashed var(--line);background:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1}
#lmsg{color:#d2553f;font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Pembuat Struk</h1>

<section>
<div class="row">
<div><label for="width">Lebar kertas</label><select id="width"><option value="384">58 mm</option><option value="576">80 mm</option></select></div>
<div><label for="logo">Logo (opsional)</label><input id="logo" type="file" accept="image/*"></div>
</div>
<div id="lmsg" role="status"></div>
<label for="lsize">Ukuran logo: <span id="lsv">100</span>%</label>
<input id="lsize" type="range" min="30" max="100" value="100">
<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="hideshop" type="checkbox" checked style="width:auto"> Sembunyikan nama toko (pakai logo saja)</label>
<label for="shop">Nama toko</label><input id="shop" value="BUTTER CREW">
<label for="addr">Alamat / keterangan (opsional)</label><input id="addr">
</section>

<section>
<label for="title">Judul struk</label><input id="title" value="ORDER RECEIPT">
<div class="row">
<div><label for="ono">No. order</label><input id="ono" value="BC-0000"></div>
<div><label for="odate">Tanggal delivery</label><input id="odate" value="-"></div>
</div>
<div class="row">
<div><label for="cust">Pelanggan</label><input id="cust" value="-"></div>
<div><label for="status">Pembayaran</label><select id="status"><option>PAID</option><option>UNPAID</option><option value="">(kosong)</option></select></div>
</div>
</section>

<section>
<div class="item head"><span>Item</span><span>Qty</span><span>Harga</span><span></span></div>
<div id="items"></div>
<button id="add" type="button">+ Tambah item</button>
<label for="del">Ongkir / Delivery Fee</label><input id="del" type="number" inputmode="numeric" min="0" value="1">
<div class="sum"><span>Subtotal</span><span id="sub">0</span></div>
<div class="sum total"><span>Total</span><span id="tot">0</span></div>
<label for="foot">Teks penutup (satu baris per teks). Awali baris dengan [ig] atau [tt] untuk logo Instagram atau TikTok.</label>
<textarea id="foot" rows="4">Thank you for ordering!
[ig] ___buttercrew
[tt] buttercrew
See you next PO</textarea>
</section>

<section class="prev">
<canvas id="cv" width="384" height="200"></canvas>
<div class="btns">
<button class="main" id="share" type="button">Bagikan / Cetak</button>
<button id="dl" type="button">Unduh PNG</button>
<button id="clr" type="button">Struk baru</button>
</div>
</section>
</main>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var itemsEl=$('items'),cv=$('cv'),ctx=cv.getContext('2d'),logoImg=null;
function num(n){return Math.round(n).toLocaleString('id-ID');}
function addRow(n,q,p){
  var d=document.createElement('div');d.className='item';
  d.innerHTML='<input class="n" placeholder="Nama item" aria-label="Nama item"><input class="q" type="number" inputmode="numeric" min="1" value="1" aria-label="Jumlah"><input class="p" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Harga satuan"><button type="button" aria-label="Hapus item">×</button>';
  if(n)d.querySelector('.n').value=n;if(q)d.querySelector('.q').value=q;if(p)d.querySelector('.p').value=p;
  d.querySelector('button').onclick=function(){d.remove();draw();};
  d.addEventListener('input',draw);
  itemsEl.appendChild(d);
}
function getItems(){
  var out=[];itemsEl.querySelectorAll('.item').forEach(function(r){
    var n=r.querySelector('.n').value.trim(),q=parseFloat(r.querySelector('.q').value)||0,p=parseFloat(r.querySelector('.p').value)||0;
    if(n||p)out.push({n:n||'-',q:q,p:p});
  });return out;
}
function wrap(c,t,w){
  var words=String(t).split(' '),lines=[],cur='';
  words.forEach(function(x){var test=cur?cur+' '+x:x;if(c.measureText(test).width>w&&cur){lines.push(cur);cur=x;}else cur=test;});
  if(cur)lines.push(cur);return lines;
}
function igIcon(c,x,y,s){c.save();var w=Math.max(2,s/9),r=s*0.3,a=x+w/2,b=y+w/2,d=s-w;c.lineWidth=w;c.strokeStyle='#000';c.beginPath();c.moveTo(a+r,b);c.arcTo(a+d,b,a+d,b+d,r);c.arcTo(a+d,b+d,a,b+d,r);c.arcTo(a,b+d,a,b,r);c.arcTo(a,b,a+d,b,r);c.closePath();c.stroke();c.beginPath();c.arc(x+s/2,y+s/2,s*0.22,0,6.2832);c.stroke();c.beginPath();c.arc(x+s*0.77,y+s*0.23,w*0.6,0,6.2832);c.fillStyle='#000';c.fill();c.restore();}
function ttIcon(c,x,y,s){c.save();c.translate(x,y);c.scale(s/24,s/24);c.fillStyle='#000';c.fill(new Path2D('M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z'));c.restore();}
function render(c,W){
  var m=Math.round(W/24),fs=W>400?27:21,y=m,items=getItems();
  var sub=items.reduce(function(s,i){return s+i.q*i.p;},0),del=parseFloat($('del').value)||0;
  var ls=(parseInt($('lsize').value,10)||100)/100;
  function f(sz,b,i){c.font=(i?'italic ':'')+(b?'bold ':'')+sz+'px Helvetica,Arial,sans-serif';}
  function txt(s,x,al,sz,b,i){f(sz,b,i);c.textAlign=al;c.fillText(s,x,y);}
  function rule(th){y+=4;c.fillRect(m,y,W-2*m,th);y+=th+10;}
  function row(a,b,sz,bold){txt(a,m,'left',sz,bold);txt(b,W-m,'right',sz,bold);y+=sz+8;}
  c.fillStyle='#fff';c.fillRect(0,0,W,c.canvas.height);c.fillStyle='#000';c.textBaseline='top';
  if(logoImg){var lw=(W-2*m)*ls,lh=lw*logoImg.height/logoImg.width;c.drawImage(logoImg,(W-lw)/2,y,lw,lh);y+=lh+10;}
  if(!$('hideshop').checked&&$('shop').value){txt($('shop').value,W/2,'center',fs+6,true);y+=fs+14;}
  if($('addr').value){f(fs-4);wrap(c,$('addr').value,W-2*m).forEach(function(l){txt(l,W/2,'center',fs-4);y+=fs+2;});y+=4;}
  rule(2);
  if($('title').value){txt($('title').value,W/2,'center',fs+2,true);y+=fs+14;}
  var meta=[['Order No.',$('ono').value],['Delivery',$('odate').value],['Customer',$('cust').value]].filter(function(r){return r[1];});
  f(fs);var lw0=0;meta.forEach(function(r){lw0=Math.max(lw0,c.measureText(r[0]).width);});
  meta.forEach(function(r){txt(r[0],m,'left',fs);txt(': '+r[1],m+lw0+4,'left',fs);y+=fs+8;});
  rule(1);
  var cq=W-m-Math.round(W*0.27),nameW=cq-m-Math.round(fs*2.2);
  txt('ITEM',m,'left',fs-2,true);txt('QTY',cq,'right',fs-2,true);txt('TOTAL',W-m,'right',fs-2,true);y+=fs+6;
  rule(2);
  items.forEach(function(i){
    f(fs);wrap(c,i.n,nameW).forEach(function(l,k){
      txt(l,m,'left',fs);
      if(k===0){txt(String(i.q),cq,'right',fs);txt(num(i.q*i.p),W-m,'right',fs);}
      y+=fs+8;
    });y+=2;
  });
  rule(1);
  row('Subtotal',num(sub),fs);
  if(del>0)row('Delivery Fee',num(del),fs);
  rule(2);
  row('TOTAL',num(sub+del),fs+6,true);
  if($('status').value){y+=4;txt('Payment: '+$('status').value,m,'left',fs);y+=fs+10;}
  rule(1);
  var fl=$('foot').value.split('\n').filter(function(s){return s.trim();});
  fl.forEach(function(s,k){
    var b=k===0,it=k>0&&k===fl.length-1&&fl.length>2,ic=s.match(/^\[(ig|tt)\]\s*(.*)$/i);
    if(ic){f(fs);var is=fs+2,tw=c.measureText(ic[2]).width,x0=(W-(is+8+tw))/2;(ic[1].toLowerCase()==='ig'?igIcon:ttIcon)(c,x0,y,is);txt(ic[2],x0+is+8,'left',fs);y+=fs+10;return;}
    f(fs,b,it);wrap(c,s,W-2*m).forEach(function(l){txt(l,W/2,'center',fs,b,it);y+=fs+6;});
  });
  y+=50;
  return {h:y,sub:sub,tot:sub+del};
}
function draw(){
  var W=parseInt($('width').value,10);
  var t=document.createElement('canvas');t.width=W;t.height=8000;
  var r=render(t.getContext('2d'),W);
  $('sub').textContent=num(r.sub);$('tot').textContent='Rp '+num(r.tot);
  cv.width=W;cv.height=Math.ceil(r.h);render(ctx,W);
}
function blob(cb){cv.toBlob(cb,'image/png');}
$('add').onclick=function(){addRow();draw();};
['shop','addr','title','ono','odate','cust','status','del','foot','width','lsize','hideshop'].forEach(function(id){$(id).addEventListener('input',draw);});
$('logo').onchange=function(e){
  var f=e.target.files[0];if(!f){logoImg=null;draw();return;}
  var im=new Image();
  im.onerror=function(){logoImg=null;draw();$('lmsg').textContent='Gambar tidak bisa dibaca. Coba simpan sebagai PNG atau JPG.';};
  im.onload=function(){
    var c=document.createElement('canvas');c.width=im.width;c.height=im.height;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
    var d=x.getImageData(0,0,c.width,c.height),px=d.data,minX=c.width,minY=c.height,maxX=-1,maxY=-1;
    for(var yy=0;yy<c.height;yy++){for(var xx=0;xx<c.width;xx++){
      var i=(yy*c.width+xx)*4,v=(px[i]+px[i+1]+px[i+2])/3,b=v<200;
      px[i]=px[i+1]=px[i+2]=b?0:255;px[i+3]=255;
      if(b){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;}
    }}
    if(maxX<0){logoImg=null;draw();$('lmsg').textContent='Logo terlalu terang untuk dicetak. Gunakan logo yang berwarna gelap.';return;}
    x.putImageData(d,0,0);
    var cw=maxX-minX+1,ch=maxY-minY+1,o=document.createElement('canvas');o.width=cw;o.height=ch;
    var ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,cw,ch);ox.drawImage(c,minX,minY,cw,ch,0,0,cw,ch);
    logoImg=o;$('lmsg').textContent='';draw();
  };
  var rd=new FileReader();
  rd.onerror=function(){$('lmsg').textContent='File gagal dibaca. Coba PNG atau JPG.';};
  rd.onload=function(){im.src=rd.result;};
  rd.readAsDataURL(f);
};
function today(){return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
$('clr').onclick=function(){
  itemsEl.innerHTML='';addRow('-',1);
  $('cust').value='-';$('del').value='';$('odate').value='-';
  $('ono').value=$('ono').value.replace(/(\d+)(\D*)$/,function(a,n,s){var k=String(parseInt(n,10)+1);while(k.length<n.length)k='0'+k;return k+s;});
  draw();
};
$('dl').onclick=function(){
  blob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='struk.png';document.body.appendChild(a);a.click();a.remove();});
};
$('share').onclick=function(){
  blob(function(b){
    var f=new File([b],'struk.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});}
    else{$('dl').click();}
  });
};
